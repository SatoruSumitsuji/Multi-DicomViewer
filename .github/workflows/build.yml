name: Build distributables

# Trigger options:
#   - Push a tag like `v1.0.0` to build BOTH platforms and attach to a Release
#   - Run manually from the Actions tab (Run workflow) for either platform
#   - On every push to main: just build and upload as artifacts (no Release)
#
# macOS code-signing + notarization is OPTIONAL and self-gating: the signing
# steps run only when the signing secrets are present (see "Detect signing
# config" below). With no secrets the macOS build is produced UNSIGNED exactly
# as before, so this workflow is safe to merge before the Apple Developer
# credentials exist. Required secrets to turn signing ON:
#   MACOS_CERT_P12_BASE64       base64 of the Developer ID Application .p12
#   MACOS_CERT_PASSWORD         password protecting that .p12
#   MACOS_NOTARY_KEY_P8_BASE64  base64 of the App Store Connect API key (.p8)
#   MACOS_NOTARY_KEY_ID         that API key's Key ID
#   MACOS_NOTARY_ISSUER_ID      App Store Connect Issuer ID (UUID)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# action-gh-release needs write access to create the GitHub Release on v* tags
# (without this the release step fails with "Resource not accessible by integration").
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      # The CT viewer's render backend differs per OS: VTK on Windows
      # (requirements.txt), pygfx/wgpu on macOS (requirements-mac.txt).
      # Installing the wrong set leaves the packaged app unable to import
      # its CTViewer ("CT viewer unavailable").
      - name: Install runtime deps (Windows — VTK CT)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt

      - name: Install runtime deps (macOS — pygfx/wgpu CT)
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-mac.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean Multi-DicomViewer.spec

      # ----- macOS signing gate: ON only when the cert secret is present -----
      - name: Detect signing config (macOS)
        id: signcfg
        if: runner.os == 'macOS'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "${CERT_B64:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "macOS signing: ENABLED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing: DISABLED (no MACOS_CERT_P12_BASE64) — unsigned build"
          fi

      # Import the Developer ID Application cert into a throwaway keychain and
      # discover its identity hash (so the exact identity string isn't needed
      # as a secret).
      - name: Import signing certificate (macOS)
        id: keychain
        if: runner.os == 'macOS' && steps.signcfg.outputs.enabled == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PW" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN" -T /usr/bin/codesign
          # Put our keychain first in the search list (keep the originals too).
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported cert"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Using signing identity: $IDENTITY"

      - name: Codesign app (macOS)
        if: runner.os == 'macOS' && steps.signcfg.outputs.enabled == 'true'
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          set -euo pipefail
          APP="dist/Multi-DicomViewer.app"
          ENT="packaging/entitlements.plist"
          # Sign every nested Mach-O binary inside-out, then the bundle last.
          # (Detect by content, not extension, to catch framework binaries and
          # extensionless helpers PyInstaller bundles.)
          find "$APP" -type f | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --timestamp --options runtime \
                --entitlements "$ENT" --sign "$IDENTITY" "$f"
            fi
          done
          codesign --force --timestamp --options runtime \
            --entitlements "$ENT" --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # ----- Windows: zip the onedir output (incl. the restart launcher) -----
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ship the one-click restart launcher next to the exe so users get it
          # out of the box (the .cmd auto-detects the exe vs a dev checkout).
          Copy-Item restart_viewer.cmd dist/Multi-DicomViewer/ -Force
          Compress-Archive -Path dist/Multi-DicomViewer/* `
                           -DestinationPath dist/Multi-DicomViewer-windows.zip

      # ----- macOS: zip the bare .app as the NOTARIZATION CARRIER only -----
      # Full app on macOS too: CT renders via the pygfx (wgpu→Metal) viewer.
      # The distributed archive is rebuilt (with the restart launcher) in the
      # "Package macOS" step below; this carrier stays a bare .app so Apple
      # notarizes exactly the bundle.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
                Multi-DicomViewer.app Multi-DicomViewer-macos.zip

      # Submit to Apple, wait for the result, staple the ticket onto the .app
      # (lets Gatekeeper pass even offline). The final zip is built next.
      - name: Notarize + staple (macOS)
        if: runner.os == 'macOS' && steps.signcfg.outputs.enabled == 'true'
        env:
          KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/notary.p8"
          echo "$KEY_B64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool submit dist/Multi-DicomViewer-macos.zip \
            --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          xcrun stapler staple dist/Multi-DicomViewer.app

      # Rebuild the DISTRIBUTED zip as a folder holding the (stapled) .app AND
      # the one-click restart launcher, so users get the launcher out of the
      # box. ditto preserves the signature + stapled ticket on the copied .app.
      - name: Package macOS (app + restart launcher)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cd dist
          rm -f Multi-DicomViewer-macos.zip
          rm -rf pkg && mkdir -p "pkg/Multi-DicomViewer"
          ditto "Multi-DicomViewer.app" "pkg/Multi-DicomViewer/Multi-DicomViewer.app"
          cp ../restart_viewer.command "pkg/Multi-DicomViewer/restart_viewer.command"
          chmod +x "pkg/Multi-DicomViewer/restart_viewer.command"
          cd pkg
          ditto -c -k --sequesterRsrc --keepParent \
                "Multi-DicomViewer" ../Multi-DicomViewer-macos.zip

      # Artifact name is what GitHub shows in the run's UI.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multi-DicomViewer-${{ runner.os }}
          path: |
            dist/Multi-DicomViewer-windows.zip
            dist/Multi-DicomViewer-macos.zip
          if-no-files-found: ignore

      # ----- On a v* tag: also attach the zips to a GitHub Release -----
      - name: Attach to Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Multi-DicomViewer-windows.zip
            dist/Multi-DicomViewer-macos.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
