name: Build distributables

# Trigger options:
#   - Push a tag like `v1.0.0` to build BOTH platforms and attach to a Release
#   - Run manually from the Actions tab (Run workflow) for either platform
#   - On every push to main: just build and upload as artifacts (no Release)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# action-gh-release needs write access to create the GitHub Release on v* tags
# (without this the release step fails with "Resource not accessible by integration").
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      # The CT viewer's render backend differs per OS: VTK on Windows
      # (requirements.txt), pygfx/wgpu on macOS (requirements-mac.txt).
      # Installing the wrong set leaves the packaged app unable to import
      # its CTViewer ("CT viewer unavailable").
      - name: Install runtime deps (Windows — VTK CT)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt

      - name: Install runtime deps (macOS — pygfx/wgpu CT)
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-mac.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean Multi-DicomViewer.spec

      # ----- Windows: zip the onedir output -----
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Multi-DicomViewer/* `
                           -DestinationPath dist/Multi-DicomViewer-windows.zip

      # ----- macOS: zip the .app bundle (preserve symlinks/perms with ditto) -----
      # Full app on macOS too: CT renders via the pygfx (wgpu→Metal) viewer.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
                Multi-DicomViewer.app Multi-DicomViewer-macos.zip

      # Artifact name is what GitHub shows in the run's UI.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multi-DicomViewer-${{ runner.os }}
          path: |
            dist/Multi-DicomViewer-windows.zip
            dist/Multi-DicomViewer-macos.zip
          if-no-files-found: ignore

      # ----- On a v* tag: also attach the zips to a GitHub Release -----
      - name: Attach to Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Multi-DicomViewer-windows.zip
            dist/Multi-DicomViewer-macos.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
